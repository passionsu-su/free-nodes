# Clash Meta / mihomo 提速版：基于 meta.yaml，去掉全部去广告规则；开启 IPv6、嗅探、并发握手；
# 自动选择容差 20ms、测速超时 2s（慢节点直接淘汰）；新增「⚡ 负载均衡」组（按域名分散到多个节点，适合大文件/多线程下载）。
# 节点每 6 小时从 clash/all.yaml 自动拉取。
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true
proxy-providers:
  free:
    type: http
    url: https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/all.yaml
    path: ./proxies/free-nodes.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false
      timeout: 2000
      expected-status: 204
    override:
      udp: true
  fast:
    type: http
    url: https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/fast.yaml
    path: ./proxies/free-nodes-fast.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false
      timeout: 3000
      expected-status: 204
    override:
      udp: true
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🏎️ 高速节点
  - 🔯 故障转移
  - ⚡ 负载均衡
  - 🇭🇰 香港
  - 🇯🇵 日本
  - 🇸🇬 新加坡
  - 🇺🇸 美国
  - 🇪🇺 欧洲
  - 🌐 其他地区
  - DIRECT
  use:
  - free
  exclude-filter: (?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset
- name: ♻️ 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 20
  lazy: false
  timeout: 2000
  use:
  - free
  exclude-filter: (?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset
  expected-status: 204
- name: 🔯 故障转移
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 80
  lazy: false
  timeout: 2000
  proxies:
  - 🇺🇸 美国
  - 🇪🇺 欧洲
  - 🇯🇵 日本
  - 🇸🇬 新加坡
  - 🇭🇰 香港
  - 🌐 其他地区
  expected-status: 204
- name: ⚡ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 2000
  lazy: false
  expected-status: 204
  use:
  - free
  exclude-filter: (?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset
- name: 🏎️ 高速节点
  type: select
  proxies:
  - 🏎️ 高速优选
  use:
  - fast
  exclude-filter: "(?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset"

- name: 🏎️ 高速优选
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  max-failed-times: 2
  lazy: false
  timeout: 3000
  expected-status: 204
  use:
  - fast

- name: 🤖 AI
