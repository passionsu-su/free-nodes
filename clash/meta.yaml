# ---------------- 规则（自上而下匹配） ----------------
rules:
  # 微信 / QQ 直连（防「当前网络不可用」）
  - PROCESS-NAME,com.tencent.mm,DIRECT
  - PROCESS-NAME,com.tencent.mobileqq,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,weixinbridge.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT
  - DOMAIN-SUFFIX,qlogo.cn,DIRECT
  - DOMAIN-SUFFIX,tencent-cloud.net,DIRECT
  # 去广告
  - RULE-SET,adb-sukka-nodrop,🛑 广告拦截
  - RULE-SET,adb-sukka-drop,REJECT-DROP
  - RULE-SET,adb-sukka-nonip,🛑 广告拦截
  - RULE-SET,adb-awavenue,🛑 广告拦截
  - RULE-SET,adb-ads,🛑 广告拦截
  # 分流
  - RULE-SET,sp-private,DIRECT
  - RULE-SET,sp-ai,🤖 AI
  - RULE-SET,sp-youtube,📺 YouTube
  - RULE-SET,sp-netflix,🎬 Netflix
  - RULE-SET,sp-tiktok,🎵 TikTok
  - RULE-SET,sp-telegram,✈️ Telegram
  - RULE-SET,sp-github,🐱 GitHub
  - RULE-SET,sp-google,🔍 Google
  - RULE-SET,sp-steam-cn,DIRECT
  - RULE-SET,sp-steam,🎮 Steam
  - RULE-SET,sp-ms-cn,DIRECT
  - RULE-SET,sp-microsoft,Ⓜ️ 微软
  - RULE-SET,sp-apple-cn,DIRECT
  - RULE-SET,sp-apple,🍎 苹果
  - RULE-SET,sp-gfw,🚀 节点选择
  - RULE-SET,sp-cn,🎯 国内直连
  - RULE-SET,sp-notcn,🚀 节点选择
  # IP 类（no-resolve 防 DNS 泄漏）
  - RULE-SET,adb-sukka-ip,🛑 广告拦截,no-resolve
  - RULE-SET,sp-ip-private,DIRECT,no-resolve
  - RULE-SET,sp-ip-telegram,✈️ Telegram,no-resolve
  - RULE-SET,sp-ip-netflix,🎬 Netflix,no-resolve
  - RULE-SET,sp-ip-google,🔍 Google,no-resolve
  - RULE-SET,sp-ip-cn,🎯 国内直连
  - MATCH,🐟 漏网之鱼

# ---------------- DNS ----------------
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:sp-private
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "+.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "localhost.ptlogin2.qq.com"
    - "+.push.apple.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.qq.com"
    - "+.miwifi.com"
    - "+.mi.com"
    - "+.xiaomi.com"
  use-hosts: true
  respect-rules: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: ["https://223.5.5.5/dns-query", "https://doh.pub/dns-query"]
  nameserver: ["https://223.5.5.5/dns-query", "https://doh.pub/dns-query"]
  nameserver-policy:
    "rule-set:sp-cn,sp-private": ["https://223.5.5.5/dns-query", "https://doh.pub/dns-query"]
    "rule-set:sp-gfw,sp-notcn": ["https://1.1.1.1/dns-query#🚀 节点选择", "https://8.8.8.8/dns-query#🚀 节点选择"]

# ---------------- 嗅探 ----------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8081-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain:
    - "+.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.push.apple.com"
    - "Mijia Cloud"
    - "+.mi.com"
    - "+.xiaomi.com"
