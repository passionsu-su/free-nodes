    use:
      - free
    filter: "(?i)^(🇭🇰|HK(\\b|_))|香港|Hong ?Kong"

  - name: 🇯🇵 日本
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    max-failed-times: 2
    tolerance: 50
    lazy: false
    timeout: 2000
