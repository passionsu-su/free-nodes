# ============================================================
# Clash Meta / Mihomo 完整配置 v1.4
# 更新日期：2026-11-21
# 适用：FlClash / CMFA / Clash Verge Rev
#
# 功能：
# 1. 免费节点自动更新
# 2. 地区自动测速、故障转移；🏎️ 高速节点（按实测下载速度筛选）
# 3. Fake-IP + DoH DNS
# 4. 国内外应用分流（MetaCubeX 规则集，已去掉去广告与 china-direct 大列表，减轻负担）
# 5. 微信及腾讯正常业务直连
# 6. 关闭 Sniffer，优先保证微信兼容性
#
# 订阅地址：https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/meta.yaml
# ============================================================

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

# ============================================================
# 1. 节点来源
# ============================================================

proxy-providers:
  free:
    type: http
    url: https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/all.yaml
    path: ./proxies/free-nodes.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false
      timeout: 2000
      expected-status: 204
    override:
      udp: true
  fast:
    type: http
    url: https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/fast.yaml
    path: ./proxies/free-nodes-fast.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false
      timeout: 3000
      expected-status: 204
    override:
      udp: true

# ============================================================
# 2. 策略组
# ============================================================

proxy-groups:

  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🏎️ 高速节点
      - 🔯 故障转移
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🇪🇺 欧洲
      - 🌐 其他地区
      - DIRECT
    use:
      - free
    exclude-filter: &info "(?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset"

  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    max-failed-times: 2
    tolerance: 50
    lazy: false
    timeout: 2000
    expected-status: 204
    use:
      - free
    exclude-filter: *info

  - name: 🔯 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    max-failed-times: 2
    tolerance: 50
    lazy: false
    timeout: 2000
    expected-status: 204
    proxies:
      - 🇺🇸 美国
      - 🇪🇺 欧洲
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🌐 其他地区

  - name: 🏎️ 高速节点
    type: select
    proxies:
      - 🏎️ 高速优选
    use:
      - fast
    exclude-filter: "(?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset"

  - name: 🏎️ 高速优选
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    max-failed-times: 2
    lazy: false
    timeout: 3000
    expected-status: 204
    use:
      - fast

  - name: 🤖 AI
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇪🇺 欧洲
      - 🚀 节点选择

  - name: 📺 YouTube
    type: select
    proxies:
      - 🚀 节点选择
      - 🏎️ 高速节点
      - ♻️ 自动选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🇪🇺 欧洲

  - name: 🎬 Netflix
    type: select
    proxies:
      - 🚀 节点选择
      - 🏎️ 高速节点
      - ♻️ 自动选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🇪🇺 欧洲

  - name: 🎵 TikTok
    type: select
    proxies:
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🇪🇺 欧洲
      - 🚀 节点选择

  - name: ✈️ Telegram
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇺🇸 美国
      - 🇪🇺 欧洲

  - name: 🔍 Google
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇪🇺 欧洲

  - name: 🐱 GitHub
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: Ⓜ️ 微软
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🍎 苹果
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🎮 Steam
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🎯 国内直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT
      - ♻️ 自动选择

  # ---------------- 地区自动测速 ----------------

  - name: 🇭🇰 香港
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    max-failed-times: 2
    tolerance: 50
    lazy: false
    timeout: 2000
