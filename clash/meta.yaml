# Clash Meta / mihomo 完整配置 v1.1（2026-10-27，规则改走 jsDelivr 直连，去广告精简为合并版）
# 节点：passionsu-su/free-nodes 每日免费节点（proxy-provider 自动更新）
# 功能：DNS 防泄漏（Fake-IP + DoH）、去广告、分流、地区分组、微信/QQ 直连、嗅探
# 适用：Clash Meta for Android（CMFA）、FlClash、Clash Verge Rev 等 mihomo 内核客户端
# 订阅地址：https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/meta.yaml

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true

# ---------------- 节点来源 ----------------
anchors:
  provider: &provider
    type: http
    interval: 21600           # 6 小时拉一次节点
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      lazy: true
    override:
      skip-cert-verify: true
      udp: true
  test: &test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
    timeout: 3000
  info: &info "(?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset"

proxy-providers:
  free:
    <<: *provider
    url: https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/all.yaml
    path: ./proxies/free-nodes.yaml

# ---------------- 策略组 ----------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🔯 故障转移, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲, 🌐 其他地区, DIRECT]
    include-all-providers: true
    exclude-filter: *info

  - name: ♻️ 自动选择
    type: url-test
    <<: *test
    include-all-providers: true
    exclude-filter: *info

  - name: 🔯 故障转移
    type: fallback
    <<: *test
    proxies: [🇺🇸 美国, 🇪🇺 欧洲, 🇯🇵 日本, 🇸🇬 新加坡, 🇭🇰 香港, 🌐 其他地区]

  - name: 🤖 AI
    type: select
    proxies: [🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🇪🇺 欧洲, 🚀 节点选择]

  - name: 📺 YouTube
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲]

  - name: 🎬 Netflix
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲]

  - name: 🎵 TikTok
    type: select
    proxies: [🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲, 🚀 节点选择]

  - name: ✈️ Telegram
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇸🇬 新加坡, 🇭🇰 香港, 🇺🇸 美国, 🇪🇺 欧洲]

  - name: 🔍 Google
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, 🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🇭🇰 香港, 🇪🇺 欧洲]

  - name: 🐱 GitHub
    type: select
    proxies: [🚀 节点选择, ♻️ 自动选择, DIRECT]

  - name: Ⓜ️ 微软
    type: select
    proxies: [DIRECT, 🚀 节点选择]

  - name: 🍎 苹果
    type: select
    proxies: [DIRECT, 🚀 节点选择]

  - name: 🎮 Steam
    type: select
    proxies: [🚀 节点选择, DIRECT]

  - name: 🎯 国内直连
    type: select
    proxies: [DIRECT, 🚀 节点选择]

  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, DIRECT, ♻️ 自动选择]

  # 地区组（自动测速选最快）
  - name: 🇭🇰 香港
    type: url-test
    <<: *test
    include-all-providers: true
    filter: "(?i)^(🇭🇰|HK(\\b|_))|香港|Hong ?Kong"
  - name: 🇯🇵 日本
    type: url-test
    <<: *test
    include-all-providers: true
    filter: "(?i)^(🇯🇵|JP(\\b|_))|日本|Japan|Tokyo"
  - name: 🇸🇬 新加坡
    type: url-test
    <<: *test
    include-all-providers: true
    filter: "(?i)^(🇸🇬|SG(\\b|_))|新加坡|Singapore"
  - name: 🇺🇸 美国
    type: url-test
    <<: *test
    include-all-providers: true
    filter: "(?i)^(🇺🇸|US(\\b|_))|美国|United States"
  - name: 🇪🇺 欧洲
    type: url-test
    <<: *test
    include-all-providers: true
    filter: "(?i)^(🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇮🇹|🇪🇸|🇵🇱|🇸🇪|🇫🇮|🇨🇭|🇦🇹|🇨🇿|🇮🇪|🇱🇻|🇱🇺|🇩🇰|🇧🇪|🇳🇴|🇵🇹|🇷🇴|🇭🇺|🇪🇪|🇱🇹|🇧🇬|🇬🇷|(GB|UK|DE|FR|NL|IT|ES|PL|SE|FI|CH|AT|CZ|IE|LV|LU|DK|BE|NO|PT|RO|HU|EE|LT|BG|GR)(\\b|_))"
  - name: 🌐 其他地区
    type: url-test
    <<: *test
    include-all-providers: true
    exclude-filter: "(?i)^(🇭🇰|🇯🇵|🇸🇬|🇺🇸|🇨🇳|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇮🇹|🇪🇸|🇵🇱|🇸🇪|🇫🇮|🇨🇭|🇦🇹|🇨🇿|🇮🇪|🇱🇻|🇱🇺|🇩🇰|🇧🇪|🇳🇴|🇵🇹|🇷🇴|🇭🇺|🇪🇪|🇱🇹|🇧🇬|🇬🇷|(HK|JP|SG|US|CN|GB|UK|DE|FR|NL|IT|ES|PL|SE|FI|CH|AT|CZ|IE|LV|LU|DK|BE|NO|PT|RO|HU|EE|LT|BG|GR)(\\b|_))|剩余|流量|到期|官网"

# ---------------- 规则集 ----------------
rule-anchor:
  mrs: &mrs { type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT }
  ipmrs: &ipmrs { type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT }
  cls: &cls { type: http, behavior: classical, format: text, interval: 86400 }

rule-providers:
  # 去广告：ads.mrs = 217heidai + anti-AD + HaGeZi Pro + Loyalsoldier 合并去重（v2ray-adblock 每 12 小时构建）
  adb-ads:          { <<: *mrs, url: "https://testingcf.jsdelivr.net/gh/passionsu-su/v2ray-adblock@geosite/ads.mrs", path: ./ruleset/adb-ads.mrs }
  adb-awavenue:     { <<: *mrs, url: "https://testingcf.jsdelivr.net/gh/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Clash.mrs", path: ./ruleset/adb-awavenue.mrs }
  adb-sukka-nodrop: { <<: *cls, url: "https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt", path: ./ruleset/adb-sukka-nodrop.txt }
  adb-sukka-drop:   { <<: *cls, url: "https://ruleset.skk.moe/Clash/non_ip/reject-drop.txt", path: ./ruleset/adb-sukka-drop.txt }
  adb-sukka-nonip:  { <<: *cls, url: "https://ruleset.skk.moe/Clash/non_ip/reject.txt", path: ./ruleset/adb-sukka-nonip.txt }
  adb-sukka-ip:     { <<: *cls, url: "https://ruleset.skk.moe/Clash/ip/reject.txt", path: ./ruleset/adb-sukka-ip.txt }
