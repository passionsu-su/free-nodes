rules:
  # 微信广告专项（须在腾讯直连之前）
  - DOMAIN,wxsnsdy.wxs.qq.com,REJECT
  - DOMAIN,wxsnsdythumb.wxs.qq.com,REJECT
  - DOMAIN,wxsnsdyvip.wxs.qq.com,REJECT
  - DOMAIN,wxsnsdy.tc.qq.com,REJECT
  - DOMAIN,adsmind.gdtimg.com,REJECT
  - DOMAIN,adsmind.apdcdn.tc.qq.com,REJECT
  - DOMAIN,e.qq.com,REJECT
  - DOMAIN,l.qq.com,REJECT
  - DOMAIN,adsfile.qq.com,REJECT
  - DOMAIN,ad.weixin.qq.com,REJECT
  - DOMAIN,ad.video.qq.com,REJECT
  - DOMAIN,wa.gtimg.com,REJECT
  - DOMAIN-SUFFIX,gdt.qq.com,REJECT
  - DOMAIN-SUFFIX,pgdt.gtimg.cn,REJECT
  - DOMAIN-SUFFIX,pgdt.gtimg.com,REJECT
  # 通用广告
  - RULE-SET,reject,🛑 广告拦截
  # 私有网络 / 微信腾讯
  - RULE-SET,private,DIRECT
  - PROCESS-NAME,WeChat.exe,DIRECT
  - PROCESS-NAME,Weixin.exe,DIRECT
  - PROCESS-NAME,QQ.exe,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT
  - DOMAIN-SUFFIX,qlogo.cn,DIRECT
  - RULE-SET,applications,DIRECT
  # 分流
  - RULE-SET,openai,🤖 AI
  - RULE-SET,claude,🤖 AI
  - RULE-SET,gemini,🤖 AI
  - RULE-SET,youtube,📺 YouTube
  - RULE-SET,netflix,🎬 Netflix
  - RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,github,🐱 GitHub
  - RULE-SET,google,🔍 Google
  - RULE-SET,steam,🎮 Steam
  - RULE-SET,microsoft,Ⓜ️ 微软
  - RULE-SET,apple,🍎 苹果
  # 国内外
  - RULE-SET,gfw,🚀 节点选择
  - RULE-SET,proxy,🚀 节点选择
  - RULE-SET,direct,🎯 国内直连
  - RULE-SET,telegramcidr,✈️ Telegram,no-resolve
  - RULE-SET,lancidr,DIRECT,no-resolve
  - RULE-SET,cncidr,🎯 国内直连,no-resolve
  - GEOIP,CN,🎯 国内直连
  - MATCH,🐟 漏网之鱼

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.ntp.org"
    - "time.windows.com"
    - "+.qq.com"
    - "+.wechat.com"
    - "+.qpic.cn"
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: ["https://223.5.5.5/dns-query", "https://doh.pub/dns-query"]
  fallback: ["https://1.1.1.1/dns-query", "https://8.8.8.8/dns-query"]
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: [240.0.0.0/4, 0.0.0.0/32]
    domain: ["+.google.com", "+.youtube.com", "+.github.com", "+.openai.com", "+.chatgpt.com", "+.telegram.org"]

hosts:
  'wxsnsdy.wxs.qq.com': 0.0.0.0
  'wxsnsdythumb.wxs.qq.com': 0.0.0.0
  'wxsnsdyvip.wxs.qq.com': 0.0.0.0
  'wxsnsdy.tc.qq.com': 0.0.0.0
  'adsmind.gdtimg.com': 0.0.0.0
  'adsmind.apdcdn.tc.qq.com': 0.0.0.0
