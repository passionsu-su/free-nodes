# ============================================================
# Clash for Windows 0.20.x（Clash Premium 内核）完整配置 v1.0  2026-10-28
# 订阅：https://raw.githubusercontent.com/passionsu-su/free-nodes/main/clash/cfw.yaml
# 节点：clash/cfw-nodes.yaml（每日从 all.yaml 过滤出 Premium 支持的 ss/vmess/trojan/http）
# 去广告：微信专项 + Loyalsoldier reject；分流：AI/流媒体/Telegram/GitHub 等；DNS：Fake-IP + DoH
# Premium 不支持 VLESS/Hysteria2/TUIC/Reality，这些节点请用 meta.yaml + Clash Verge Rev
# ============================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  free:
    type: http
    url: https://testingcf.jsdelivr.net/gh/passionsu-su/free-nodes@main/clash/cfw-nodes.yaml
    path: ./proxies/cfw-nodes.yaml
    interval: 21600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [♻️ 自动选择, 🔯 故障转移, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲, DIRECT]
    use: [free]
  - name: ♻️ 自动选择
    type: url-test
    use: [free]
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
  - name: 🔯 故障转移
    type: fallback
    proxies: [🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🇭🇰 香港, 🇪🇺 欧洲, ♻️ 自动选择]
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
  - name: 🤖 AI
    type: select
    proxies: [🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🇪🇺 欧洲, 🚀 节点选择]
  - name: 📺 YouTube
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲]
  - name: 🎬 Netflix
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲]
  - name: 🎵 TikTok
    type: select
    proxies: [🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🚀 节点选择]
  - name: ✈️ Telegram
    type: select
    proxies: [🚀 节点选择, 🇸🇬 新加坡, 🇭🇰 香港, 🇺🇸 美国]
  - name: 🔍 Google
    type: select
    proxies: [🚀 节点选择, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, 🇪🇺 欧洲]
  - name: 🐱 GitHub
    type: select
    proxies: [🚀 节点选择, DIRECT]
  - name: Ⓜ️ 微软
    type: select
    proxies: [DIRECT, 🚀 节点选择]
  - name: 🍎 苹果
    type: select
    proxies: [DIRECT, 🚀 节点选择]
  - name: 🎮 Steam
    type: select
    proxies: [🚀 节点选择, DIRECT]
  - name: 🎯 国内直连
    type: select
    proxies: [DIRECT, 🚀 节点选择]
  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, DIRECT]
  - name: 🇭🇰 香港
    type: url-test
    use: [free]
    filter: "(?i)(🇭🇰|香港|HK|Hong ?Kong)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
  - name: 🇯🇵 日本
    type: url-test
    use: [free]
    filter: "(?i)(🇯🇵|日本|JP|Japan)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
  - name: 🇸🇬 新加坡
    type: url-test
    use: [free]
    filter: "(?i)(🇸🇬|新加坡|SG|Singapore)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
  - name: 🇺🇸 美国
    type: url-test
    use: [free]
    filter: "(?i)(🇺🇸|美国|US|United States)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true
  - name: 🇪🇺 欧洲
    type: url-test
    use: [free]
    filter: "(?i)(🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇮🇪|🇸🇪|🇫🇮|🇨🇭|🇵🇱|英国|德国|法国|荷兰)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true

