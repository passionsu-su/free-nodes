name: Collect and test free nodes

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "11 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-nodes-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Download mihomo
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | python -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if "linux-amd64-compatible" in x["name"] and x["name"].endswith(".gz")))' )"
          curl -fL "$url" -o mihomo.gz
          gzip -df mihomo.gz
          chmod +x mihomo
          ./mihomo -v
      - name: Collect, deduplicate and real-test nodes
        run: python scripts/aggregate.py
      - name: Convert to client subscription formats
        run: python scripts/convert.py
      - name: Commit only changed feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/all.yaml v2ray/all.txt region/clash region/*.txt shadowrocket/sub.txt surge/surge.conf surge/proxies.list quantumultx/qx.txt loon/loon.list singbox/singbox.json stash/stash.yaml clashmi/clashmi.yaml clash/cfw.yaml clash/cfw-nodes.yaml report.json README.md
          if git diff --cached --quiet; then
            echo "No changes; keeping current publication."
            exit 0
          fi
          git commit -m "chore: refresh tested free nodes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Push failed after three rebase attempts" >&2
          exit 1
