name: Collect and test free nodes

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "11 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-nodes-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Download mihomo
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | python -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if "linux-amd64-compatible" in x["name"] and x["name"].endswith(".gz")))' )"
          curl -fL "$url" -o mihomo.gz
          gzip -df mihomo.gz
          chmod +x mihomo
          ./mihomo -v
      - name: Collect, deduplicate and real-test nodes
        run: python scripts/aggregate.py
      - name: Download and start subconverter
        shell: bash
        run: |
          set -Eeuo pipefail
          workdir=/tmp/subconverter
          log=/tmp/subconverter.log
          mkdir -p "$workdir"
          curl --retry 3 --retry-all-errors --retry-delay 2 -fL https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz -o /tmp/subconverter.tar.gz
          echo "=== archive contents ==="
          tar -tzf /tmp/subconverter.tar.gz | head -80
          tar -xzf /tmp/subconverter.tar.gz -C "$workdir"
          echo "=== extracted files ==="
          find "$workdir" -maxdepth 3 -type f -printf '%M %p\n' | sort | head -100
          binary="$(find "$workdir" -maxdepth 3 -type f -name subconverter -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "ERROR: subconverter executable not found in release archive" >&2
            exit 1
          fi
          chmod +x "$binary"
          cd "$(dirname "$binary")"
          echo "=== binary dependencies ==="
          ldd "$binary" || true
          : > "$log"
          "$binary" >"$log" 2>&1 &
          pid=$!
          echo "Started subconverter PID=$pid"
          ready=0
          for i in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 4 -fsS http://127.0.0.1:25500/version -o /tmp/subconverter-version.txt; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "ERROR: subconverter process exited during startup (iteration $i)" >&2
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "ERROR: subconverter health check failed; process state:" >&2
            ps -fp "$pid" || true
            echo "=== subconverter startup log ===" >&2
            cat "$log" >&2 || true
            echo "=== listening sockets ===" >&2
            (ss -lntp || true) >&2
            exit 1
          fi
          echo "=== subconverter version endpoint ==="
          cat /tmp/subconverter-version.txt
          echo
          echo "Subconverter is healthy on 127.0.0.1:25500"
      - name: Convert to client subscription formats
        run: python scripts/convert.py
      - name: Commit only changed feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/all.yaml v2ray/all.txt region/clash region/*.txt shadowrocket/sub.txt surge/surge.conf quantumultx/qx.txt loon/loon.list singbox/singbox.json stash/stash.yaml clashmi/clashmi.yaml clash/cfw.yaml clash/cfw-nodes.yaml report.json README.md
          if git diff --cached --quiet; then
            echo "No changes; keeping current publication."
            exit 0
          fi
          git commit -m "chore: refresh tested free nodes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Push failed after three rebase attempts" >&2
          exit 1
